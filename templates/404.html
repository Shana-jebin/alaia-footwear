<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — ALAIA</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --dark:   #2a2520;
      --gold:   #c9a96e;
      --cream:  #fdfcfa;
      --muted:  #888;
      --light:  #f5f0e8;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--dark);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    /* ── Animated ambient background ── */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: drift 12s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .bg-orb-1 {
      width: 600px; height: 600px;
      background: #c9a96e;
      top: -200px; right: -100px;
      animation-delay: 0s;
    }
    .bg-orb-2 {
      width: 400px; height: 400px;
      background: #2a2520;
      bottom: -150px; left: -100px;
      animation-delay: -5s;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.05); }
    }

    /* ── Main container ── */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 24px;
      max-width: 560px;
      width: 100%;
      animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Brand ── */
    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 5px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 48px;
      text-decoration: none;
      display: block;
    }

    /* ── 404 number ── */
    .error-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(100px, 22vw, 180px);
      font-weight: 300;
      line-height: 0.85;
      color: var(--dark);
      letter-spacing: -4px;
      position: relative;
      margin-bottom: 8px;
    }
    .error-number::after {
      content: '';
      display: block;
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: 24px auto 0;
    }

    /* ── Text ── */
    .error-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 400;
      font-style: italic;
      color: var(--dark);
      margin: 28px 0 12px;
      letter-spacing: 0.5px;
    }

    .error-sub {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.8px;
      line-height: 1.8;
      font-weight: 400;
      margin-bottom: 44px;
    }

    /* ── Actions ── */
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-block;
      padding: 14px 32px;
      background: var(--dark);
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 4px;
      transition: background 0.25s, transform 0.2s;
    }
    .btn-primary:hover {
      background: #3d3530;
      transform: translateY(-1px);
    }

    .btn-outline {
      display: inline-block;
      padding: 14px 32px;
      border: 1px solid var(--dark);
      color: var(--dark);
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 4px;
      transition: background 0.25s, color 0.25s, transform 0.2s;
    }
    .btn-outline:hover {
      background: var(--dark);
      color: #fff;
      transform: translateY(-1px);
    }

    /* ── Suggestions ── */
    .suggestions {
      margin-top: 56px;
      padding-top: 32px;
      border-top: 1px solid #e8e2d8;
    }
    .suggestions-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .suggestions-links {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .suggestions-links a {
      font-size: 12px;
      color: var(--dark);
      text-decoration: none;
      letter-spacing: 0.5px;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: border-color 0.2s, color 0.2s;
    }
    .suggestions-links a:hover {
      color: var(--gold);
      border-color: var(--gold);
    }

    @media (max-width: 480px) {
      .actions { flex-direction: column; align-items: center; }
      .btn-primary, .btn-outline { width: 100%; max-width: 280px; text-align: center; }
    }
  </style>
</head>
<body>

  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div class="container">

    <a class="brand" href="/">ALAIA</a>

    <div class="error-number">404</div>

    <div class="error-title">This page has stepped out.</div>
    <p class="error-sub">
      The page you're looking for doesn't exist, has been moved,<br>
      or is currently unavailable.
    </p>

    <div class="actions">
      <a href="/" class="btn-primary">Back to Home</a>
      <a href="/products/" class="btn-outline">Browse Collection</a>
    </div>

    <div class="suggestions">
      <div class="suggestions-label">You might be looking for</div>
      <div class="suggestions-links">
        <a href="/products/">Shop</a>
        <a href="/orders/cart/">Cart</a>
        <a href="/orders/wishlist/">Wishlist</a>
        <a href="/profile/">My Account</a>
        <a href="/orders/my-orders/">Orders</a>
      </div>
    </div>

  </div>

</body>
</html>
